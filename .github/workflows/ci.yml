# Actions are pinned to commit SHAs; Dependabot maintains these pins.
name: CI
'on':
  push:
    branches:
    - '**'
  pull_request: null
  workflow_dispatch: null
  workflow_call: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - &id002
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - run: python scripts/package.py
    - run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests
    - run: ./mvnw --batch-mode --no-transfer-progress -f examples/text-tools/pom.xml test-compile
    - run: python scripts/release.py assets
    - run: python scripts/release.py verify-assets
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets
        path: dist/
        if-no-files-found: error
        retention-days: 14
  compatibility:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          java: '8'
        - os: ubuntu-latest
          java: '25'
        - os: windows-latest
          java: '17'
    steps:
    - *id001
    - *id002
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: dist
    - run: python scripts/test_consumer.py
  signing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - *id001
    - *id002
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - run: python scripts/test_signing.py
    - run: python scripts/test_signing.py --unprotected
