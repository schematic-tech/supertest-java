# Actions are pinned to commit SHAs; Dependabot maintains these pins.
name: Release
'on':
  push:
    tags:
    - v*
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'schematic-tech/supertest-java'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - run: python scripts/release.py guard
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: dist
    - run: python scripts/release.py verify-assets
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: '17'
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_PASSWORD
    - run: python scripts/publish.py
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    - run: python scripts/release.py github
      env:
        GH_TOKEN: ${{ github.token }}
